<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>PACT 运行时控制台</title>
    <link rel="stylesheet" href="/assets/style.css">
  </head>
  <body>
    <div class="shell">
      <header class="masthead">
        <div>
          <p class="eyebrow">PACT // 运行时控制台</p>
          <h1>工作总览</h1>
          <p class="subtitle">查看候选代码、验证证据与待确认问题。</p>
        </div>
        <div class="read-only"><span></span>只读视图</div>
      </header>

      <div id="empty-state" class="empty-state" hidden>
        <p class="eyebrow">等待工作状态</p>
        <h2>尚无工作记录</h2>
        <p>请在另一个终端启动 <code>pact campaign run</code>，本页面会自动连接。</p>
      </div>

      <main id="dashboard" class="dashboard" hidden>
        <section id="overview-panel" class="panel panel-hero panel-wide"></section>
        <section id="candidate-panel" class="panel panel-wide"></section>
        <section id="verification-panel" class="panel panel-wide"></section>
        <section id="acceptance-panel" class="panel panel-wide"></section>
        <section id="questions-panel" class="panel panel-wide"></section>
        <section id="artifacts-panel" class="panel panel-wide"></section>
      </main>

      <footer>
        <span id="connection-state">正在连接…</span>
        <span id="generated-at"></span>
      </footer>
    </div>
    <script src="/assets/app.js" defer></script>
  </body>
</html>
